<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>SpeakDaily</title>
<meta name="theme-color" content="#F5C518">
<meta name="description" content="Her gün 20 dakika İngilizce konuşma pratiği">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="SpeakDaily">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=Familjen+Grotesk:wght@500;600;700&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Layout: airport-wayfinding sign band on top, today's plan as a rail, one working card per step */
:root{
  --bg:#F2F5F4; --surface:#FFFFFF; --sunk:#E8EDEB; --ink:#13201E; --muted:#56655F; --line:#D3DCD9;
  --sign:#F5C518; --sign-ink:#13201E; --accent:#0D6B5B; --accent-ink:#FFFFFF;
  --ok:#1C7F46; --okbg:#E3F3E9; --warn:#9A6312; --warnbg:#FBF0DA; --bad:#B23A0E; --badbg:#FBE6DC;
  --display:"Familjen Grotesk", "Helvetica Neue", Arial, sans-serif;
  --body:"Atkinson Hyperlegible", "Segoe UI", system-ui, sans-serif;
  --mono:"JetBrains Mono", ui-monospace, Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0E1514; --surface:#16201E; --sunk:#1D2927; --ink:#E6EEEB; --muted:#93A39E; --line:#2A3835;
  --sign:#F5C518; --sign-ink:#13201E; --accent:#53C4AE; --accent-ink:#0E1514;
  --ok:#5AD68A; --okbg:#173326; --warn:#F0B44C; --warnbg:#33281A; --bad:#FB8C5E; --badbg:#3A2219; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E1514; --surface:#16201E; --sunk:#1D2927; --ink:#E6EEEB; --muted:#93A39E; --line:#2A3835;
  --sign:#F5C518; --sign-ink:#13201E; --accent:#53C4AE; --accent-ink:#0E1514;
  --ok:#5AD68A; --okbg:#173326; --warn:#F0B44C; --warnbg:#33281A; --bad:#FB8C5E; --badbg:#3A2219; color-scheme:dark}

*{box-sizing:border-box}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0;-webkit-text-size-adjust:100%}
img{max-width:100%}
[hidden]{display:none!important}
.recbox{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.btn.rec{background:var(--ink);color:var(--surface);border-color:var(--ink);padding:12px 20px;font-size:1.05rem}
.btn.rec.on{background:var(--bad);border-color:var(--bad);color:#fff;animation:pulse 1.2s ease-in-out infinite}
.btn.rec svg{width:18px;height:18px}
@keyframes pulse{50%{box-shadow:0 0 0 8px rgba(178,58,14,.18)}}
.recstat{font-size:.9rem;color:var(--muted);min-width:0}
.modelbar{grid-column:1/-1;display:flex;gap:12px;align-items:center;flex-wrap:wrap;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 16px}
.modelbar p{margin:0;flex:1;min-width:220px}
.modelbar .prog{height:6px;border-radius:3px;background:var(--sunk);overflow:hidden;flex-basis:100%}
.modelbar .prog i{display:block;height:100%;background:var(--accent);width:0;transition:width .3s}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.55}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--sign)}
h1,h2,h3{font-family:var(--display);line-height:1.15;text-wrap:balance;margin:0}
button{font:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.wrap{max-width:1100px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* Sign band */
.band{background:var(--sign);color:var(--sign-ink);position:sticky;top:env(safe-area-inset-top,0px);z-index:5;border-bottom:3px solid var(--sign-ink)}
.band .wrap{display:flex;align-items:center;gap:16px;flex-wrap:wrap;padding-block:12px}
.brand{display:flex;align-items:center;gap:10px;font-family:var(--display);font-weight:700;font-size:1.35rem;letter-spacing:-.01em}
.brand .glyph{width:30px;height:30px;border-radius:6px;background:var(--sign-ink);color:var(--sign);display:grid;place-items:center;font-size:.95rem}
.band .meta{display:flex;gap:10px;align-items:center;margin-left:auto;flex-wrap:wrap}
.chip{font-family:var(--mono);font-size:.8rem;font-weight:600;letter-spacing:.04em;text-transform:uppercase;background:var(--sign-ink);color:var(--sign);padding:5px 10px;border-radius:5px;font-variant-numeric:tabular-nums;white-space:nowrap}
.seg{display:inline-flex;border:2px solid var(--sign-ink);border-radius:6px;overflow:hidden}
.seg button{border:0;background:transparent;color:var(--sign-ink);padding:4px 10px;font-family:var(--mono);font-size:.78rem;font-weight:600}
.seg button[aria-pressed="true"]{background:var(--sign-ink);color:var(--sign)}

/* Progress meter */
.meter{display:flex;align-items:center;gap:10px;font-family:var(--mono);font-size:.82rem;font-weight:600}
.meter .bar{width:120px;height:8px;border-radius:4px;background:rgba(19,32,30,.18);overflow:hidden}
.meter .bar i{display:block;height:100%;background:var(--sign-ink);width:0;transition:width .4s}

main.wrap{display:grid;grid-template-columns:240px minmax(0,1fr);gap:28px;padding-block:28px 48px}
@media (max-width:820px){main.wrap{grid-template-columns:minmax(0,1fr);gap:18px;padding-block:18px 40px}}

/* Plan rail */
.rail h2{font-size:.78rem;font-family:var(--mono);text-transform:uppercase;letter-spacing:.1em;color:var(--muted);font-weight:600;margin-bottom:10px}
.plan{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:4px}
.plan button{width:100%;display:grid;grid-template-columns:44px 1fr;align-items:center;gap:10px;text-align:left;border:1px solid transparent;background:transparent;color:var(--ink);padding:9px 10px;border-radius:8px}
.plan button:hover{background:var(--sunk)}
.plan button[aria-current="true"]{background:var(--surface);border-color:var(--line)}
.plan .min{font-family:var(--mono);font-size:.78rem;color:var(--muted);font-variant-numeric:tabular-nums}
.plan .lbl{font-weight:700}
.plan .sub{display:block;font-weight:400;font-size:.84rem;color:var(--muted)}
.plan .done .lbl::after{content:" ✓";color:var(--ok)}
.railnote{margin-top:18px;font-size:.85rem;color:var(--muted);border-top:1px solid var(--line);padding-top:14px}
@media (max-width:820px){
  .plan{flex-direction:row;overflow-x:auto;gap:6px;padding-bottom:4px}
  .plan li{flex:0 0 auto}
  .plan button{grid-template-columns:auto;gap:0;padding:8px 12px}
  .plan .min,.plan .sub{display:none}
  .railnote{display:none}
}

/* Work card */
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:24px;min-width:0}
@media (max-width:520px){.card{padding:18px}}
.eyebrow{font-family:var(--mono);font-size:.75rem;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:600}
.head{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap;margin-bottom:16px}
.head h1{font-size:1.6rem}
.steps{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:20px}
.steps span{font-size:.82rem;padding:4px 10px;border-radius:999px;background:var(--sunk);color:var(--muted)}
.steps span.on{background:var(--ink);color:var(--surface);font-weight:700}
.steps span.past{color:var(--ok);background:var(--okbg)}

.sentence{font-family:var(--display);font-size:1.55rem;font-weight:600;line-height:1.3;margin:4px 0 6px;text-wrap:balance}
.tr{color:var(--muted);font-style:italic}
.hidden-text{filter:blur(6px);user-select:none;transition:filter .2s}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.stack{display:flex;flex-direction:column;gap:14px}

.btn{border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:9px 14px;border-radius:8px;font-weight:700;display:inline-flex;align-items:center;gap:8px}
.btn:hover{background:var(--sunk)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.primary:hover{filter:brightness(1.07)}
.btn.ghost{border-color:transparent;background:transparent;color:var(--accent);padding-inline:6px}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn svg{width:16px;height:16px;flex:none}

.vocab{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px}
.vcard{border:1px solid var(--line);border-radius:10px;padding:14px;display:flex;flex-direction:column;gap:8px;background:var(--bg)}
.vcard .w{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.vcard .w b{font-family:var(--display);font-size:1.25rem}
.lvl{font-family:var(--mono);font-size:.72rem;font-weight:600;padding:2px 6px;border-radius:4px;background:var(--sign);color:var(--sign-ink)}
.vcard .ex{font-style:italic}
.tag{font-family:var(--mono);font-size:.72rem;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}

textarea,input[type=time],select{width:100%;font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:10px 12px}
textarea{min-height:76px;resize:vertical}
.mic{display:flex;gap:10px;align-items:flex-start;font-size:.88rem;color:var(--muted);background:var(--sunk);border-radius:8px;padding:10px 12px}
.mic svg{width:18px;height:18px;flex:none;margin-top:2px}

.result{border-radius:10px;padding:14px 16px;display:flex;flex-direction:column;gap:10px}
.result.ok{background:var(--okbg)}.result.mid{background:var(--warnbg)}.result.low{background:var(--badbg)}
.score{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.score b{font-family:var(--mono);font-size:1.6rem;font-variant-numeric:tabular-nums}
.ok .score b{color:var(--ok)}.mid .score b{color:var(--warn)}.low .score b{color:var(--bad)}
.diff{font-size:1.1rem;line-height:2}
.diff span{padding:1px 4px;border-radius:4px;margin-right:2px}
.diff .k{color:var(--ok)}
.diff .s{background:var(--surface);color:var(--bad);text-decoration:underline wavy;text-underline-offset:4px}
.diff .s small{color:var(--muted);text-decoration:line-through;margin-left:4px;font-size:.8em}
.diff .d{border:1.5px dashed var(--bad);color:var(--bad)}
.diff .i{color:var(--muted);text-decoration:line-through}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:.8rem;color:var(--muted)}
.note{border-left:3px solid var(--ink);padding:2px 0 2px 12px}
.note b{display:block;font-size:.82rem;font-family:var(--mono);text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin-bottom:2px}

.foot{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-top:22px;padding-top:16px;border-top:1px solid var(--line)}

.qs{display:flex;flex-direction:column;gap:16px}
.q fieldset{border:0;padding:0;margin:0;display:flex;flex-direction:column;gap:6px}
.q legend{font-weight:700;margin-bottom:6px}
.opt{display:flex;gap:10px;align-items:center;padding:9px 12px;border:1px solid var(--line);border-radius:8px;cursor:pointer}
.opt.right{background:var(--okbg);border-color:var(--ok)}.opt.wrong{background:var(--badbg);border-color:var(--bad)}

.reading{font-size:1.1rem;line-height:1.85;max-width:65ch}
.reading button.word{border:0;background:transparent;color:inherit;padding:0;font:inherit;border-bottom:2px dotted var(--accent);cursor:help}
.pop{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:12px 14px}

.summary{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.stat{border:1px solid var(--line);border-radius:10px;padding:12px 14px}
.stat b{display:block;font-family:var(--mono);font-size:1.5rem;font-variant-numeric:tabular-nums}
.stat span{font-size:.85rem;color:var(--muted)}
pre{font-family:var(--mono);font-size:.78rem;background:var(--sunk);border-radius:8px;padding:12px;overflow-x:auto;margin:0}
table{border-collapse:collapse;width:100%;font-size:.92rem}
td,th{text-align:left;padding:7px 8px;border-bottom:1px solid var(--line)}
th{font-size:.75rem;font-family:var(--mono);text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
td.n{font-family:var(--mono);font-variant-numeric:tabular-nums}
.tablewrap{overflow-x:auto}

.stopfab{position:fixed;right:calc(16px + env(safe-area-inset-right,0px));bottom:calc(20px + env(safe-area-inset-bottom,0px));z-index:19;background:var(--ink);color:var(--surface);border:0;border-radius:999px;padding:12px 18px;font-weight:700;display:inline-flex;gap:8px;align-items:center;box-shadow:0 6px 20px rgba(0,0,0,.25)}
.stopfab svg{width:14px;height:14px}
.btn.stop{color:var(--bad)}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--surface);padding:10px 16px;border-radius:8px;font-size:.9rem;max-width:calc(100% - 32px);z-index:20}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>


<header class="band">
  <div class="wrap">
    <div class="brand"><span class="glyph" aria-hidden="true">EN</span>SpeakDaily</div>
    <div class="meta">
      <div class="meter" title="Bugünkü aktif çalışma süresi">
        <span id="timeTxt">0:00 / 20:00</span>
        <span class="bar" aria-hidden="true"><i id="timeBar"></i></span>
      </div>
      <span class="chip" id="streakChip">Seri 0 gün</span>
      <div class="seg" role="group" aria-label="Aksan">
        <button id="accUS" aria-pressed="true">US</button>
        <button id="accGB" aria-pressed="false">GB</button>
      </div>
    </div>
  </div>
</header>

<main class="wrap">
  <div class="modelbar" id="modelBar" hidden></div>
  <nav class="rail" aria-label="Bugünün planı">
    <h2>Bugünün planı · 20 dk</h2>
    <ul class="plan" id="plan"></ul>
    <p class="railnote">Süre yalnızca sayfa açıkken ve son 90 saniyede bir şey yaptıysan sayılır. 20 dakika dolunca günlük hedef tamamlanır.</p>
  </nav>
  <section class="card" id="view" aria-live="polite"></section>
</main>

<button class="stopfab" id="stopFab" data-stop hidden><svg viewBox="0 0 16 16" fill="currentColor" aria-hidden="true"><rect x="3" y="3" width="10" height="10" rx="1.5"/></svg>Sesi durdur</button>
<div class="toast" id="toast" hidden></div>

<script>
/* ---------- Content pack (örnek: 1. gün) ---------- */
const PACK = {
  sentences: [
    { id:"s1", topic:"Veri merkezi", en:"I need to schedule a maintenance window for the server room.",
      tr:"Sunucu odası için bir bakım penceresi planlamam gerekiyor.",
      accepted:["I need to schedule a maintenance window for the server room.","I have to schedule a maintenance window for the server room.","I need to plan a maintenance window for the server room.","I have to plan a maintenance window for the server room."],
      note:"“need to + fiil” = bir şeyi yapman gerektiğini söyler. Türkçedeki “-mam gerekiyor” yapısının en doğal karşılığıdır.",
      vocab:[{w:"schedule",l:"A2",tr:"planlamak, takvime koymak",ex:"Let's schedule a meeting for Monday."},
             {w:"maintenance",l:"B1",tr:"bakım",ex:"The car needs regular maintenance."}]},
    { id:"s2", topic:"Havalimanı", en:"Could you tell me where the boarding gate is?",
      tr:"Biniş kapısının nerede olduğunu söyleyebilir misiniz?",
      accepted:["Could you tell me where the boarding gate is?","Can you tell me where the boarding gate is?","Could you tell me where the gate is?"],
      note:"Dolaylı soruda (Could you tell me…) soru sırası bozulur: “where is the gate” değil, “where the gate is” denir.",
      vocab:[{w:"boarding",l:"B1",tr:"uçağa biniş",ex:"Boarding starts thirty minutes before departure."},
             {w:"gate",l:"A2",tr:"kapı (havalimanında uçuş kapısı)",ex:"Our flight leaves from gate twelve."}]},
    { id:"s3", topic:"Veri merkezi", en:"We have been monitoring the cooling system since this morning.",
      tr:"Bu sabahtan beri soğutma sistemini izliyoruz.",
      accepted:["We have been monitoring the cooling system since this morning.","We've been monitoring the cooling system since this morning.","We have been watching the cooling system since this morning."],
      note:"Türkçede “-iyoruz” dense de, geçmişte başlayıp hâlâ süren iş için “have been + -ing” kullanılır. “since” başlangıç anını verir.",
      vocab:[{w:"monitor",l:"B1",tr:"izlemek, takip etmek",ex:"Nurses monitor patients during the night."},
             {w:"cooling",l:"B1",tr:"soğutma",ex:"The cooling fans are very loud today."}]},
    { id:"s4", topic:"Toplantı", en:"I'm afraid I can't make it to the meeting tomorrow.",
      tr:"Korkarım yarınki toplantıya yetişemeyeceğim.",
      accepted:["I'm afraid I can't make it to the meeting tomorrow.","I'm afraid I won't make it to the meeting tomorrow.","I'm afraid I can't come to the meeting tomorrow.","I'm afraid I won't be able to come to the meeting tomorrow."],
      note:"“I'm afraid” burada korku değil, kibar bir “maalesef”tir. “make it” = yetişmek, katılabilmek.",
      vocab:[{w:"afraid",l:"A2",tr:"korkmuş; (kibar) maalesef",ex:"I'm afraid we are fully booked tonight."},
             {w:"make it",l:"B1",tr:"yetişmek, gelebilmek",ex:"Sorry, I can't make it to your party."}]},
    { id:"s5", topic:"Veri merkezi", en:"The backup generator started automatically when the power went out.",
      tr:"Elektrik kesildiğinde yedek jeneratör otomatik olarak devreye girdi.",
      accepted:["The backup generator started automatically when the power went out.","The backup generator started automatically when the power was cut.","When the power went out, the backup generator started automatically."],
      note:"“go out” elektrik ve ışık için “kesilmek, sönmek” demektir. Geçmiş zamanda “went out” olur.",
      vocab:[{w:"backup",l:"B1",tr:"yedek",ex:"Always keep a backup of your photos."},
             {w:"generator",l:"B1",tr:"jeneratör",ex:"The hospital has its own generator."},
             {w:"automatically",l:"B1",tr:"otomatik olarak",ex:"The door opens automatically."}]},
    { id:"s6", topic:"Günlük", en:"Although the flight was delayed, we arrived on time for dinner.",
      tr:"Uçuş gecikmesine rağmen akşam yemeğine zamanında vardık.",
      accepted:["Although the flight was delayed, we arrived on time for dinner.","Even though the flight was delayed, we arrived on time for dinner.","Although the flight was late, we arrived on time for dinner.","In spite of the delay, we arrived on time for dinner."],
      note:"“although” arkasından tam cümle alır (özne + fiil). “in spite of” ise isim alır: in spite of the delay.",
      vocab:[{w:"although",l:"B1",tr:"-e rağmen, gerçi",ex:"Although it was raining, we went for a walk."},
             {w:"delayed",l:"A2",tr:"gecikmiş, rötarlı",ex:"Our train was delayed by twenty minutes."},
             {w:"on time",l:"A2",tr:"zamanında",ex:"Please be on time for the interview."}]}
  ],
  listening:{
    title:"Kontrol odasında kısa bir konuşma",
    lines:[["A","Hi Murat, did you check the temperature in hall two?"],["B","Yes, it went up to twenty-seven degrees around six."],["A","That's too high. What caused it?"],["B","One of the cooling units stopped. The technician is fixing it now."],["A","Okay. Please send me an update before lunch."]],
    qs:[{q:"Salon 2'de sıcaklık kaça çıkmış?",o:["22 derece","27 derece","37 derece"],a:1},
        {q:"Sorunun sebebi ne?",o:["Elektrik kesildi","Bir soğutma ünitesi durdu","Kapı açık kaldı"],a:1},
        {q:"Güncelleme ne zaman isteniyor?",o:["Öğle yemeğinden önce","Akşam","Yarın sabah"],a:0}]
  },
  reading:{
    title:"A morning at the airport",
    text:"Every morning, the operations team meets at seven thirty. They review the night shift report and check any alarms. If there is an issue, the team leader assigns it to an engineer. Most of the time the problems are small, but the team must respond quickly because thousands of passengers depend on these systems. After the meeting, everyone checks their area and records the results in the system.",
    words:{review:["B1","gözden geçirmek","Let's review the plan before we start."],shift:["B1","vardiya","She works the night shift at the hospital."],alarms:["A2","alarmlar","The fire alarms are tested every month."],issue:["B1","sorun, mesele","We have an issue with the printer."],assigns:["B2","görevlendirir, atar","The manager assigns tasks every Monday."],respond:["B1","karşılık vermek, müdahale etmek","Firefighters respond to calls very fast."],passengers:["A2","yolcular","The bus can carry fifty passengers."],depend:["B1","bağlı olmak","Children depend on their parents."],records:["B1","kaydeder","The camera records everything."]}
  }
};

/* ---------- Cümle bankası (content/sentences.json) ---------- */
PACK.sentences.forEach(x=>{x.level=x.level||"B1";x.topic="İş: "+x.topic});
let BANK=[];                 // tüm cümleler (iş cümleleri + JSON)
let DAY=PACK.sentences.slice(); // bugünün shadowing seti
let WARM=[];                 // dünün cümleleri
const LEVELS={A2:"A2",B1:"B1",B2:"B2",mix:"Sırayla (A2 → B2)"};
function bankFrom(json){

}
function seqFor(level){return level==="mix"?BANK:BANK.filter(x=>x.level===level)}
function byId(id){return BANK.find(x=>x.id===id)||PACK.sentences.find(x=>x.id===id)}
function dayKey(offset){const d=new Date();d.setDate(d.getDate()+offset);return d.toISOString().slice(0,10)}
function buildPlan(force){

    const seq=seqFor(level);if(!seq.length)return;
    let ptr=store.get("ptr_"+level,0)%seq.length;
    if(force&&plan&&plan.level===level)ptr=plan.start;
    const ids=[];for(let k=0;k<count;k++)ids.push(seq[(ptr+k)%seq.length].id);
    plan={level,start:ptr,ids};
    store.set("plan_"+today,plan);store.set("ptr_"+level,(ptr+count)%seq.length);
  }
  const extra=store.get("extra_"+today,[]);
  DAY=plan.ids.concat(extra).map(byId).filter(Boolean);
  const y=store.get("plan_"+dayKey(-1),null);

}

function pickVoice(lang){
  if(!synth) return null;

  return vs.find(v=>v.lang.replace("_","-").toLowerCase()===lang.toLowerCase()) || vs.find(v=>v.lang.toLowerCase().startsWith(lang.slice(0,2))) || null;
}

/* ---------- Evaluation engine ---------- */
const CONTR = {"i'm":"i am","can't":"can not","cannot":"can not","won't":"will not","don't":"do not","doesn't":"does not","didn't":"did not","isn't":"is not","aren't":"are not","wasn't":"was not","we've":"we have","i've":"i have","you've":"you have","they've":"they have","it's":"it is","that's":"that is","let's":"let us","i'll":"i will","we're":"we are","you're":"you are","they're":"they are"};
function norm(s){
  s = s.toLowerCase().replace(/[’‘]/g,"'").replace(/[^a-z0-9'\s-]/g," ");
  return s.split(/\s+/).filter(Boolean).flatMap(w=>(CONTR[w]||w).split(" "));
}
function align(t,h){
  const n=t.length,m=h.length,D=[...Array(n+1)].map(()=>Array(m+1).fill(0));
  for(let i=0;i<=n;i++)D[i][0]=i; for(let j=0;j<=m;j++)D[0][j]=j;
  for(let i=1;i<=n;i++)for(let j=1;j<=m;j++)D[i][j]=Math.min(D[i-1][j]+1,D[i][j-1]+1,D[i-1][j-1]+(t[i-1]===h[j-1]?0:1));
  const ops=[];let i=n,j=m;
  while(i>0||j>0){
    if(i>0&&j>0&&D[i][j]===D[i-1][j-1]+(t[i-1]===h[j-1]?0:1)){ops.push({op:t[i-1]===h[j-1]?"k":"s",t:t[i-1],h:h[j-1]});i--;j--}
    else if(i>0&&D[i][j]===D[i-1][j]+1){ops.push({op:"d",t:t[i-1]});i--}
    else{ops.push({op:"i",h:h[j-1]});j--}
  }
  return ops.reverse();
}
function scoreOps(ops,n){
  const bad=ops.filter(o=>o.op==="s"||o.op==="d").length, ins=ops.filter(o=>o.op==="i").length;
  return Math.max(0,Math.round(100*(n-bad-0.5*ins)/n));
}
const ART=new Set(["a","an","the"]), PREP=new Set(["to","for","in","on","at","of","with","from","since"]), AUX=new Set(["have","has","been","be","is","are","am","was","were","will","do","does","did","can","could"]);
function diagnose(ops,tw,hw){
  const notes=[];
  const miss=ops.filter(o=>o.op==="d"||o.op==="s").map(o=>o.t);
  if(miss.some(w=>ART.has(w))) notes.push(["Artikel","İngilizcede tekil sayılabilir isimlerin önüne a/an/the gelir. Türkçede karşılığı olmadığı için en sık unutulan kelimelerdir."]);
  if(miss.some(w=>PREP.has(w))) notes.push(["Edat","Bu cümlede bir edat (to, for, since…) eksik ya da farklı. Türkçede bu anlamı ekler taşır (-e, -için, -den beri); İngilizcede ayrı kelime gerekir."]);
  if(miss.some(w=>AUX.has(w))) notes.push(["Yardımcı fiil","Zamanı kuran yardımcı fiil (have, been, was, can…) eksik. Zaman yapısını tam söylemezsen cümlenin anlamı değişebilir."]);
  const a=[...tw].sort().join(" "), b=[...hw].sort().join(" ");
  if(a===b && tw.join(" ")!==hw.join(" ")) notes.unshift(["Kelime sırası","Kelimelerin hepsi doğru ama sırası farklı. İngilizce cümle sırası genelde özne + fiil + nesne şeklindedir."]);
  return notes;
}
function grade(score){return score>=85?"ok":score>=60?"mid":"low"}
function verdict(score,mode){
  if(score>=85) return mode==="tr"?"Doğru. Anlam ve yapı yerinde.":"Çok iyi, cümleyi doğru tekrarladın.";
  if(score>=60) return "Kısmen doğru. İşaretli yerlere bak.";
  return "Bir kez daha deneyelim. Önce yavaş dinle.";
}
function diffHTML(ops){
  return ops.map(o=>{
    if(o.op==="k") return `<span class="k">${o.t}</span>`;
    if(o.op==="s") return `<span class="s">${o.t}<small>${esc(o.h)}</small></span>`;
    if(o.op==="d") return `<span class="d">${o.t}</span>`;
    return `<span class="i">${esc(o.h)}</span>`;
  }).join(" ");
}
function esc(s){return String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]))}

function resultHTML(r,mode){
  const s=DAY[S.i];
  const g=grade(r.score);
  let extra="";
  if(mode==="en" && g!=="ok" && r.missed.length){
    extra+=`<div class="row"><span class="tag">Kelimeyi tek başına dinle:</span>${r.missed.map(w=>`<button class="btn ghost" data-word="${esc(w)}">${I.slow}${esc(w)}</button>`).join("")}</div>`;

    if(g!=="ok" && !r.notes.length && s.note) extra+=`<div class="note"><b>İpucu</b>${s.note}</div>`;
    if(g!=="ok") extra+=`<div><button class="btn ghost" data-accept>Bence de doğru, kabul et</button></div>`;
  } else {
    extra+=r.notes.map(n=>`<div class="note"><b>${n[0]}</b>${n[1]}</div>`).join("");
  }
  return `<div class="result ${g}">
    <div class="score"><b>${r.score}%</b><span>${verdict(r.score,mode)}</span></div>
    <div class="diff">${diffHTML(r.ops)}</div>
    <div class="legend"><span>Yeşil: doğru</span><span>Dalgalı: yanlış söylenen</span><span>Kesikli: eksik</span><span>Üstü çizili: fazla</span></div>
    ${extra}</div>`;
}
function check(mode){
  const s=DAY[S.i];
  const ta=document.getElementById(mode==="shadow"?"ans1":"ans2");
  const text=ta.value.trim();
  if(!text){toast("Önce Konuş'a basıp cümleyi söyle.");return}
  const hw=norm(text);
  let best=s.en, tw=norm(s.en), ops=align(tw,hw), score=scoreOps(ops,tw.length);
  if(mode==="tr"){
    const vars=[...s.accepted,...(custom[s.id]||[])];
    for(const v of vars){const t=norm(v),o=align(t,hw),sc=scoreOps(o,t.length);if(sc>score){score=sc;ops=o;tw=t;best=v}}
  }
  const missed=[...new Set(ops.filter(o=>o.op==="s"||o.op==="d").map(o=>o.t))];
  missed.forEach(w=>{if(w.length>3){weak[w]=(weak[w]||0)+1}}); store.set("weak",weak);
  const r={text,score,ops,missed,best,notes:diagnose(ops,tw,hw)};
  S.results[s.id]=S.results[s.id]||{};
  if(mode==="shadow"){S.tries++;S.results[s.id].shadow=r;document.getElementById("res1").innerHTML=resultHTML(r,"en");
    document.querySelector(".steps+div .tag:last-of-type");render();}
  else{S.results[s.id].tr=r;render();}
}

      <div class="stat"><b>${avg(sh)}</b><span>Shadowing ortalaması</span></div>
      <div class="stat"><b>${avg(tr)}</b><span>TR → EN ortalaması</span></div>
      <div class="stat"><b>${qc}/${PACK.listening.qs.length}</b><span>Listening doğru</span></div>
      <div class="stat"><b>${words}</b><span>Bugünkü cümle</span></div>
    </div>
    <h2 style="font-size:1.15rem;margin-top:8px">Cümle cümle</h2>
    <div class="tablewrap"><table><thead><tr><th>Cümle</th><th>Shadowing</th><th>TR → EN</th></tr></thead><tbody>
    ${rs.map(x=>`<tr><td>${esc(x.s.en)}</td><td class="n">${x.r.shadow?x.r.shadow.score+"%":"–"}</td><td class="n">${x.r.tr?x.r.tr.score+"%":"–"}</td></tr>`).join("")}
    </tbody></table></div>
    <h2 style="font-size:1.15rem;margin-top:8px">Tekrar listesi</h2>
    <p>${weakList.length?weakList.map(([w,c])=>`<button class="btn ghost" data-word="${esc(w)}">${I.slow}${esc(w)} <span class="tag">×${c}</span></button>`).join(" "):"Henüz zorlandığın kelime yok. Shadowing yaptıkça burası dolar; aynı kelimede 3 kez zorlanırsan sonraki günlerde tekrar sorulur."}</p>
    <h2 style="font-size:1.15rem;margin-top:8px">Günlük cümleler</h2>
    <p>Her gün cümle bankasından seçtiğin seviyede yeni cümleler gelir; kaldığın yerden devam eder.</p>
    <div class="row" style="max-width:420px">
      <div style="flex:1;min-width:150px"><label for="levelSel" class="tag">Seviye</label>
        <select id="levelSel">${Object.entries(LEVELS).map(([k,v])=>`<option value="${k}" ${store.get("level","B1")===k?"selected":""}>${v}</option>`).join("")}</select></div>
      <div style="flex:1;min-width:150px"><label for="countSel" class="tag">Günde kaç cümle</label>
        <select id="countSel">${[4,6,8,10].map(n=>`<option value="${n}" ${store.get("count",6)===n?"selected":""}>${n} cümle</option>`).join("")}</select></div>
    </div>
    <h2 style="font-size:1.15rem;margin-top:8px">Günlük hatırlatma</h2>
    <p>Uygulama internet olmadan çalıştığı için hatırlatmayı telefonunun takvimi yapar. Saatleri seç, dosyayı indir ve açınca takvimine ekle. Her gün bu saatlerde bildirim gelir.</p>
    <div class="row" style="max-width:420px"><div style="flex:1;min-width:140px"><label for="rem1" class="tag">Sabah</label><input type="time" id="rem1" value="${t1}"></div>
      <div style="flex:1;min-width:140px"><label for="rem2" class="tag">Akşam (hedef dolmadıysa)</label><input type="time" id="rem2" value="${t2}"></div></div>
    <pre id="ics">${esc(ics(t1,t2))}</pre>
    <div class="row"><button class="btn primary" data-dlics>Takvim dosyasını indir</button><button class="btn" data-copyics>İçeriği kopyala</button></div>
    <h2 style="font-size:1.15rem;margin-top:8px">Ses tanıma</h2>
    <div style="max-width:420px"><label for="modelSel" class="tag">Model</label>
      <select id="modelSel">
        <option value="Xenova/whisper-base.en">Daha doğru (base.en, yaklaşık 80 MB)</option>
        <option value="Xenova/whisper-tiny.en">Daha hızlı, eski telefonlar için (tiny.en, yaklaşık 40 MB)</option>
      </select></div>
  </div>
  <div class="foot"><button class="btn" data-go="read">Geri</button><button class="btn primary" data-restart>Shadowing'i baştan başlat</button></div>`;
}
const B={level:"",topic:"",q:"",limit:40};
function renderBank(){
  const lv=B.level, list0=BANK.filter(x=>!lv||x.level===lv);
  const topics=[...new Set(list0.map(x=>x.topic))];
  const q=B.q.trim().toLowerCase();
  const list=list0.filter(x=>(!B.topic||x.topic===B.topic)&&(!q||x.en.toLowerCase().includes(q)||x.tr.toLowerCase().includes(q)));
  const inDay=new Set(DAY.map(x=>x.id));
  view.innerHTML=`<div class="head"><div><span class="eyebrow">Cümle Bankası · ${BANK.length} cümle</span><h1>Cümle seç, çalış</h1></div></div>
  <div class="stack">
    <div class="row">
      <div style="flex:1;min-width:120px"><label for="bankLevel" class="tag">Seviye</label><select id="bankLevel"><option value="">Hepsi</option>${["A2","B1","B2"].map(l=>`<option ${lv===l?"selected":""}>${l}</option>`).join("")}</select></div>
      <div style="flex:2;min-width:180px"><label for="bankTopic" class="tag">Konu</label><select id="bankTopic"><option value="">Tüm konular</option>${topics.map(t=>`<option ${B.topic===t?"selected":""}>${esc(t)}</option>`).join("")}</select></div>
      <div style="flex:2;min-width:180px"><label for="bankQ" class="tag">Ara</label><input id="bankQ" type="search" value="${esc(B.q)}" placeholder="İngilizce ya da Türkçe" style="width:100%;font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:10px 12px"></div>
    </div>
    <p class="tag">${list.length} cümle</p>
    <div class="qs">${list.slice(0,B.limit).map(x=>`<div class="vcard">
      <div class="row" style="justify-content:space-between"><span class="tag">${x.level} · ${esc(x.topic)}</span></div>
      <div style="font-family:var(--display);font-size:1.12rem;font-weight:600">${esc(x.en)}</div>
      <div class="tr">${esc(x.tr)}</div>
      <div class="row"><button class="btn ghost" data-bsay="${x.id}">${I.play}Dinle</button>
        ${inDay.has(x.id)?`<span class="tag">Bugünün listesinde</span>`:`<button class="btn ghost" data-badd="${x.id}">Bugüne ekle ve çalış</button>`}</div>
    </div>`).join("")}</div>
    ${list.length>B.limit?`<button class="btn" data-bmore>Daha fazla göster</button>`:""}
  </div>`;
}
function ics(a,b){
  const d=new Date();d.setDate(d.getDate()+1);
  const ds=d.toISOString().slice(0,10).replace(/-/g,"");
  const ev=(t,title,uid)=>`BEGIN:VEVENT\nUID:${uid}@speakdaily\nDTSTART;TZID=Europe/Istanbul:${ds}T${t.replace(":","")}00\nDURATION:PT20M\nRRULE:FREQ=DAILY\nSUMMARY:${title}\nBEGIN:VALARM\nACTION:DISPLAY\nDESCRIPTION:${title}\nTRIGGER:PT0M\nEND:VALARM\nEND:VEVENT`;
  return `BEGIN:VCALENDAR\nVERSION:2.0\nPRODID:-//SpeakDaily//TR\n${ev(a,"SpeakDaily: 20 dk İngilizce pratik","sabah")}\n${ev(b,"SpeakDaily: Bugünkü hedefin bitti mi?","aksam")}\nEND:VCALENDAR`;
}

/* ---------- Events ---------- */
document.addEventListener("click",e=>{
  const b=e.target.closest("button"); if(!b) return;
  const s=DAY[S.i], d=b.dataset;
  if("stop" in d){stopAudio();return}
  if(d.mod||d.go||d.nav){stopAudio();cancelRec()}
  if(d.mod){S.module=d.mod;render();window.scrollTo({top:0});return}
  if(d.go){S.module=d.go;render();window.scrollTo({top:0});return}
  if(d.sayTr!=null) return speak(s.vocab[d.sayTr].w+". "+s.vocab[d.sayTr].tr,"tr");
  if(d.sayEx!=null) return speak(s.vocab[d.sayEx].w+". "+s.vocab[d.sayEx].ex,"en");
  if(d.play==="en") return speak(s.en,"en");
  if(d.play==="en-slow") return speak(s.en,"en",true);
  if(d.play==="tr") return speak(s.tr,"tr");
  if(d.word) return speak(d.word,"en",true);
  if(d.warm!=null) return speak((WARM.length?WARM:DAY)[d.warm].en,"en");
  if(d.reveal){document.getElementById(d.reveal).classList.toggle("hidden-text");return}
  if(d.dialog) return speak(PACK.listening.lines.map(l=>l[1]).join(" "),"en",d.dialog==="s");
  if(d.readplay) return speak(PACK.reading.text,"en",d.readplay==="s");
  if(d.rw){S.readPick=d.rw;renderRead();return}
  if("rwtr" in d){const p=PACK.reading.words[S.readPick];return speak(p[1],"tr")}
  if("rwex" in d){const p=PACK.reading.words[S.readPick];return speak(p[2],"en")}
  if(d.check) return check(d.check);
  if("accept" in d){const r=S.results[s.id].tr;(custom[s.id]=custom[s.id]||[]).push(r.text);store.set("custom",custom);r.score=100;r.best=r.text;r.ops=align(norm(r.text),norm(r.text));r.notes=[];render();toast("Cevabın kabul edilen cevaplara eklendi.");return}
  if("readcheck" in d) return readCheck();
  if(d.rec) return toggleRec(b);
  if(d.bsay){const x=byId(d.bsay);return speak(x.en,"en")}
  if("bmore" in d){B.limit+=40;renderBank();return}
  if(d.badd){const ex=store.get("extra_"+today,[]);ex.push(d.badd);store.set("extra_"+today,ex);DAY.push(byId(d.badd));S.module="shadow";S.i=DAY.length-1;S.step=firstStep();S.tries=0;render();window.scrollTo({top:0});return}
  if("dlics" in d) return downloadIcs();
  if("loadmodel" in d) return preloadModel();
  if("copyics" in d){const t=document.getElementById("ics").textContent;
    navigator.clipboard?.writeText(t).then(()=>toast("Kopyalandı. Bir metin dosyasına yapıştırıp .ics uzantısıyla kaydet."),()=>selectText("ics"))??selectText("ics");return}
  if("restart" in d){S.module="shadow";S.i=0;S.step=firstStep(0);S.tries=0;render();return}
  if(d.nav==="next"){
    if(S.step<3){S.step++;S.tries=0;}
    else if(S.i<DAY.length-1){S.i++;S.step=firstStep();S.tries=0}
    else{S.module="listen"}
    render();view.scrollIntoView({block:"start"});return}
  if(d.nav==="prev"){if(S.step>firstStep())S.step--;else if(S.i>0){S.i--;S.step=3}render();return}
});
let bq;document.addEventListener("input",e=>{if(e.target.id==="bankQ"){clearTimeout(bq);const v=e.target.value;bq=setTimeout(()=>{B.q=v;B.limit=40;renderBank();const el=document.getElementById("bankQ");el.focus();el.setSelectionRange(v.length,v.length)},250)}});
document.addEventListener("change",e=>{
  const t=e.target;
  if(t.name&&t.name.startsWith("q")){S.quiz[+t.name.slice(1)]=+t.value;renderListen();renderPlan();return}
  if(t.id==="modelSel"){model=t.value;store.set("model",model);store.set("modelReady",false);modelUI("idle");toast("Model değişti. İlk kullanımda bir kez indirilecek.");return}
  if(t.id==="levelSel"||t.id==="countSel"){
    store.set(t.id==="levelSel"?"level":"count",t.id==="levelSel"?t.value:+t.value);
    if(!Object.keys(S.results).length){buildPlan(true);S.i=0;S.step=firstStep(0);toast("Bugünün cümleleri yenilendi.")}
    else toast("Yarından itibaren geçerli. Bugünkü cümlelere devam ediyorsun.");
    return}
  if(t.id==="bankLevel"||t.id==="bankTopic"){B[t.id==="bankLevel"?"level":"topic"]=t.value;if(t.id==="bankLevel")B.topic="";B.limit=40;renderBank();return}
  if(t.id==="rem1"||t.id==="rem2"){store.set(t.id,t.value);document.getElementById("ics").textContent=ics(document.getElementById("rem1").value,document.getElementById("rem2").value)}
});
function readCheck(){
  const tx=document.getElementById("ans3").value.trim(); if(!tx){toast("Önce metni sesli oku.");return}
  const tw=norm(PACK.reading.text),ops=align(tw,norm(tx)),sc=scoreOps(ops,tw.length);
  document.getElementById("res3").innerHTML=`<div class="result ${grade(sc)}"><div class="score"><b>${sc}%</b><span>${sc>=85?"Akıcı ve eksiksiz okudun.":"Atladığın ya da farklı okuduğun kelimeler işaretli."}</span></div><div class="diff">${diffHTML(ops)}</div></div>`;
}
function selectText(id){const r=document.createRange();r.selectNodeContents(document.getElementById(id));const s=getSelection();s.removeAllRanges();s.addRange(r);toast("Metin seçildi, kopyalayabilirsin.")}
let tt;function toast(m){const t=document.getElementById("toast");t.textContent=m;t.hidden=false;clearTimeout(tt);tt=setTimeout(()=>t.hidden=true,3200)}

document.addEventListener("keydown",e=>{if(e.key==="Escape"&&speaking)stopAudio()});

/* ---------- Accent ---------- */
function setAccent(a){accent=a;store.set("accent",a);document.getElementById("accUS").setAttribute("aria-pressed",a==="us");document.getElementById("accGB").setAttribute("aria-pressed",a==="gb")}
document.getElementById("accUS").onclick=()=>setAccent("us");
document.getElementById("accGB").onclick=()=>setAccent("gb");
setAccent(accent);

/* ---------- Active timer & streak ---------- */
let lastAct=Date.now();
["pointerdown","keydown","input"].forEach(ev=>document.addEventListener(ev,()=>lastAct=Date.now(),{passive:true}));
function fmt(s){return Math.floor(s/60)+":"+String(s%60).padStart(2,"0")}
function streak(){let n=0;const d=new Date();for(;;){const k=d.toISOString().slice(0,10);if(days[k]&&days[k].done){n++;d.setDate(d.getDate()-1)}else if(k===today){d.setDate(d.getDate()-1)}else break}return n}
function tickUI(){
  const sec=days[today].sec;
  document.getElementById("timeTxt").textContent=`${fmt(Math.min(sec,5999))} / 20:00`;
  document.getElementById("timeBar").style.width=Math.min(100,sec/12)+"%";
  document.getElementById("streakChip").textContent=`Seri ${streak()} gün`;
}
setInterval(()=>{
  if(document.visibilityState==="visible"&&Date.now()-lastAct<90000){
    days[today].sec++;
    if(!days[today].done&&days[today].sec>=1200){days[today].done=true;toast("20 dakika tamam. Bugünün hedefini bitirdin.")}
    if(days[today].sec%5===0)store.set("days",days);
    tickUI();
  }
},1000);
tickUI();

/* ---------- Ses tanıma (Whisper, cihaz içinde) ---------- */
let model=store.get("model","Xenova/whisper-base.en");
let worker=null,reqId=0;const pending={};
function getWorker(){
  if(worker) return worker;
  worker=new Worker("./whisper-worker.js",{type:"module"});
  worker.onmessage=e=>{const m=e.data;
    if(m.type==="progress") modelUI("progress",m);
    else if(m.type==="ready"){if(!store.get("modelReady",false)){store.set("modelReady",true)}modelUI("ready")}
    else if(m.type==="result"){pending[m.id]&&pending[m.id].res(m.text);delete pending[m.id]}
    else if(m.type==="error"){if(m.id!=null&&pending[m.id]){pending[m.id].rej(new Error(m.message));delete pending[m.id]}modelUI("error",m)}};
  worker.onerror=()=>{worker=null;for(const k in pending){pending[k].rej(new Error("internet bağlantısı yokken ilk indirme yapılamıyor"));delete pending[k]}modelUI("error",{message:"Ses tanıma başlatılamadı."})};
  return worker;
}
function preloadModel(){modelUI("progress",{percent:0});getWorker().postMessage({type:"preload",model})}
function transcribe(audio){return new Promise((res,rej)=>{const id=++reqId;pending[id]={res,rej};getWorker().postMessage({type:"transcribe",id,audio,model},[audio.buffer])})}
function modelUI(state,m){
  const el=document.getElementById("modelBar");
  if(state==="ready"){el.hidden=true;return}
  el.hidden=false;
  if(state==="progress"){el.innerHTML=`<p><b>Ses tanıma modeli indiriliyor</b> · %${m.percent||0}${m.mb?` · ${m.mb} MB`:""}. Bu bir kez yapılır, sonra internetsiz çalışır.</p><div class="prog"><i style="width:${m.percent||0}%"></i></div>`;return}
  if(state==="error"){el.innerHTML=`<p><b>Ses tanıma hazır değil.</b> İlk indirme için internet gerekir. ${esc(m&&m.message||"")}</p><button class="btn primary" data-loadmodel>Tekrar dene</button>`;return}
  el.innerHTML=`<p><b>Konuşma kontrolü için ses tanıma modelini indir.</b> Bir kez, Wi-Fi'deyken yapman yeterli; sonra uygulama tamamen internetsiz çalışır.</p><button class="btn primary" data-loadmodel>Şimdi indir</button>`;
}
let rec=null;
function status(target,msg){const el=document.getElementById("stat-"+target);if(el)el.textContent=msg}
function setRecUI(target,on){const b=document.querySelector(`[data-rec="${target}"]`);if(!b)return;b.classList.toggle("on",on);b.querySelector("span").textContent=on?"Bitir":"Konuş"}
function cancelRec(){if(rec){rec.cancelled=true;try{rec.mr.stop()}catch(e){}}}
async function toPCM(blob){
  const AC=window.AudioContext||window.webkitAudioContext;
  const ctx=new AC({sampleRate:16000});
  const buf=await ctx.decodeAudioData(await blob.arrayBuffer());
  const data=buf.getChannelData(0).slice(0);
  ctx.close();return data;
}
async function toggleRec(btn){
  if(rec){clearTimeout(rec.timer);rec.mr.stop();return}
  stopAudio();
  if(!navigator.mediaDevices||!window.MediaRecorder){toast("Bu tarayıcı ses kaydını desteklemiyor. Chrome ya da Safari kullan.");return}
  let stream;
  try{stream=await navigator.mediaDevices.getUserMedia({audio:{channelCount:1,echoCancellation:true,noiseSuppression:true}})}
  catch(e){toast("Mikrofon izni yok. Tarayıcı ya da telefon ayarlarından SpeakDaily'ye mikrofon izni ver.");return}
  const mr=new MediaRecorder(stream),chunks=[];
  const r={mr,target:btn.dataset.rec,mode:btn.dataset.mode,cancelled:false};rec=r;
  mr.ondataavailable=e=>{if(e.data&&e.data.size)chunks.push(e.data)};
  mr.onstop=async()=>{
    stream.getTracks().forEach(t=>t.stop());rec=null;setRecUI(r.target,false);
    if(r.cancelled)return;
    status(r.target,store.get("modelReady",false)?"Ses yazıya çevriliyor…":"İlk kullanım: ses tanıma modeli indiriliyor, ardından sesin yazıya çevrilecek…");
    try{
      const audio=await toPCM(new Blob(chunks,{type:mr.mimeType||"audio/webm"}));
      if(audio.length<8000){status(r.target,"Kayıt çok kısa oldu. Konuş'a bas, cümleyi söyle, sonra Bitir'e bas.");return}
      const text=await transcribe(audio);
      const ta=document.getElementById(r.target);if(!ta)return;
      if(!text){status(r.target,"Ses anlaşılamadı. Biraz daha yüksek ve net söyle.");return}
      ta.value=text;
      if(r.mode==="read")readCheck();else check(r.mode);
    }catch(e){status(r.target,"Ses yazıya çevrilemedi: "+e.message)}
  };
  mr.start();setRecUI(r.target,true);status(r.target,"Dinliyorum… Bitince Bitir'e bas.");
  r.timer=setTimeout(()=>{if(rec===r)mr.stop()},r.mode==="read"?90000:30000);
}
function downloadIcs(){
  const t=ics(document.getElementById("rem1").value,document.getElementById("rem2").value).replace(/\n/g,"\r\n");
  const url=URL.createObjectURL(new Blob([t],{type:"text/calendar"}));
  const a=document.createElement("a");a.href=url;a.download="speakdaily-hatirlatma.ics";document.body.appendChild(a);a.click();a.remove();
  setTimeout(()=>URL.revokeObjectURL(url),5000);toast("Dosya indirildi. Açıp takvimine ekle.");
}
const _renderSum=renderSum;renderSum=function(){_renderSum();const s=document.getElementById("modelSel");if(s)s.value=model};
if(!store.get("modelReady",false))modelUI("idle");
if("serviceWorker" in navigator)addEventListener("load",()=>navigator.serviceWorker.register("./sw.js").catch(()=>{}));
render();
</script>
